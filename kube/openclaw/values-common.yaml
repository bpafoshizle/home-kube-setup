# Shared values for all OpenClaw instances deployed to home-kube cluster
# Infrastructure-level settings only. Per-instance config (including
# openclaw.json) lives in values-personal.yaml / values-citepulse.yaml.

global:
  # Ensure resource names (like PVCs) always have their identifiers appended
  # to prevent renames and data loss when adding/removing persistence items.
  alwaysAppendIdentifierToResourceName: true

app-template:
  controllers:
    main:
      initContainers:
        init-config:
          env:
            - name: CONFIG_MODE
              value: "merge"
          command:
            - sh
            - -c
            - |
              log() { echo "[$(date -Iseconds)] [init-config] $*"; }
              log "Starting config initialization"
              mkdir -p /home/node/.openclaw /home/node/.config /home/linuxbrew
              rm -rf /home/node/.openclaw/workspace-attestations
              rm -f /home/node/.openclaw/workspace.attested /home/node/.openclaw/workspace/.attested
              rm -f /home/node/.openclaw/workspace/openclaw-workspace-state.json
              rm -f /home/node/.openclaw/workspace*.attested*
              if [ -L /home/node/.config/gogcli ]; then
                tmpdir="$(mktemp -d)"
                cp -a /home/node/.config/gogcli/. "$tmpdir/" 2>/dev/null || true
                rm /home/node/.config/gogcli
                mkdir -p /home/node/.config/gogcli
                cp -a "$tmpdir/." /home/node/.config/gogcli/ 2>/dev/null || true
                rm -rf "$tmpdir"
              fi
              CONFIG_MODE="${CONFIG_MODE:-merge}"

              if [ "$CONFIG_MODE" = "merge" ] && [ -f /home/node/.openclaw/openclaw.json ]; then
                log "Mode: merge - merging Helm config with existing config"
                node -e "
                  const fs = require('fs');
                  let existing = {};
                  try {
                    existing = JSON.parse(fs.readFileSync('/home/node/.openclaw/openclaw.json', 'utf8'));
                  } catch (e) {
                    console.error('[init-config] Warning: Failed to parse existing openclaw.json, resetting to Helm config:', e.message);
                  }
                  const helm = JSON.parse(fs.readFileSync('/config/openclaw.json', 'utf8'));
                  const deepMerge = (target, source) => {
                    for (const key of Object.keys(source)) {
                      if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                        target[key] = target[key] || {};
                        deepMerge(target[key], source[key]);
                      } else {
                        target[key] = source[key];
                      }
                    }
                    return target;
                  };
                  const merged = deepMerge(existing, helm);
                  delete merged.agents?.list;
                  delete merged.gateway?.controlUi?.allowInsecureAuth;
                  delete merged.logging?.redactSensitive;
                  delete merged.commands?.ownerDisplay;
                  delete merged.meta?.lastTouchedAt;
                  if (merged.browser?.profiles) {
                    for (const p of Object.values(merged.browser.profiles)) {
                      delete p.color;
                    }
                  }
                  if (merged.logging?.consoleStyle === 'compact') {
                    merged.logging.consoleStyle = 'pretty';
                  }
                  fs.writeFileSync('/home/node/.openclaw/openclaw.json', JSON.stringify(merged, null, 2));
                "
                log "Config merged successfully"
              else
                log "Mode: overwrite - copying Helm config"
                cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              fi
              # Migrate legacy state and identities to SQLite if present
              node -e "
                const fs = require('fs');
                const { DatabaseSync } = require('node:sqlite');
                const dbPath = '/home/node/.openclaw/state/openclaw.sqlite';
                if (fs.existsSync(dbPath)) {
                  try {
                    const db = new DatabaseSync(dbPath);
                    const devPath = '/home/node/.openclaw/identity/device.json';
                    if (fs.existsSync(devPath)) {
                      try {
                        const dev = JSON.parse(fs.readFileSync(devPath, 'utf8'));
                        db.exec(\`
                          CREATE TABLE IF NOT EXISTS device_identities (
                            identity_key TEXT NOT NULL PRIMARY KEY,
                            device_id TEXT NOT NULL,
                            public_key_pem TEXT NOT NULL,
                            private_key_pem TEXT NOT NULL,
                            created_at_ms INTEGER NOT NULL,
                            updated_at_ms INTEGER NOT NULL
                          ) STRICT;
                          CREATE INDEX IF NOT EXISTS idx_device_identities_device ON device_identities(device_id);
                        \`);
                        const insert = db.prepare('INSERT OR REPLACE INTO device_identities (identity_key, device_id, public_key_pem, private_key_pem, created_at_ms, updated_at_ms) VALUES (?, ?, ?, ?, ?, ?)');
                        insert.run('primary', dev.deviceId, dev.publicKeyPem, dev.privateKeyPem, dev.createdAtMs || Date.now(), Date.now());
                        fs.unlinkSync(devPath);
                        console.log('[init-config] Migrated legacy device.json to SQLite');
                      } catch (err) {
                        console.error('[init-config] Warning: Failed to migrate device.json:', err.message);
                      }
                    }
                    const pairedPath = '/home/node/.openclaw/devices/paired.json';
                    if (fs.existsSync(pairedPath)) {
                      try {
                        const paired = JSON.parse(fs.readFileSync(pairedPath, 'utf8'));
                        for (const [id, dev] of Object.entries(paired)) {
                          const stmt = db.prepare(\`INSERT OR REPLACE INTO device_pairing_paired (
                            device_id, public_key, display_name, platform, client_id, client_mode, role,
                            roles_json, scopes_json, approved_scopes_json, tokens_json, created_at_ms, approved_at_ms
                          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\`);
                          stmt.run(
                            dev.deviceId || id,
                            dev.publicKey || '',
                            dev.displayName || null,
                            dev.platform || null,
                            dev.clientId || null,
                            dev.clientMode || null,
                            dev.role || null,
                            JSON.stringify(dev.roles || []),
                            JSON.stringify(dev.scopes || []),
                            JSON.stringify(dev.scopes || []),
                            JSON.stringify(dev.tokens || {}),
                            dev.createdAtMs || Date.now(),
                            dev.approvedAtMs || Date.now()
                          );
                        }
                        fs.unlinkSync(pairedPath);
                        console.log('[init-config] Migrated legacy paired.json to SQLite');
                      } catch (err) {
                        console.error('[init-config] Warning: Failed to migrate paired.json:', err.message);
                      }
                    }
                    db.close();
                  } catch (err) {
                    console.error('[init-config] Warning: SQLite migration error:', err.message);
                  }
                }
              "
              rm -f /home/node/.openclaw/identity/device.json*
              rm -f /home/node/.openclaw/devices/paired.json* /home/node/.openclaw/devices/pending.json*
              rm -f /home/node/.openclaw/exec-approvals.json*
              rm -f /home/node/.openclaw/sessions /home/node/.openclaw/sessions.*.tmp
              export HOME=/home/node
              if [ -d "/home/node/.openclaw/npm" ]; then
                log "Updating plugins in ~/.openclaw/npm..."
                HOME=/home/node openclaw plugins update --all --accept-capabilities --acknowledge-install-policy-warning 2>/dev/null || true
              fi
              log "Running openclaw doctor --fix..."
              HOME=/home/node openclaw doctor --fix --yes --non-interactive 2>/dev/null || true
              chown -R 1000:1000 /home/node/.openclaw /home/node/.config /home/linuxbrew
              chown -R 0:0 /home/node/.openclaw/npm 2>/dev/null || true
              log "Config initialization complete"

        init-skills:
          command:
            - sh
            - -c
            - |
              log() { echo "[$(date -Iseconds)] [init-skills] $*"; }
              log "Starting skills initialization"

              mkdir -p /home/node/.config
              if [ -L /home/node/.config/gogcli ]; then
                tmpdir="$(mktemp -d)"
                cp -a /home/node/.config/gogcli/. "$tmpdir/" 2>/dev/null || true
                rm /home/node/.config/gogcli
                mkdir -p /home/node/.config/gogcli
                cp -a "$tmpdir/." /home/node/.config/gogcli/ 2>/dev/null || true
                rm -rf "$tmpdir"
              fi

              # Install Homebrew dependencies
              if [ ! -f /home/linuxbrew/.linuxbrew/bin/brew ]; then
                log "Installing Homebrew dependencies..."
                apt-get update && apt-get install -y build-essential procps curl file git
                
                log "Installing Homebrew..."
                # Run as node user (1000)
                su node -c 'bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
              fi

              # Add brew to path for this session
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

              if ! command -v gog >/dev/null; then
                log "Installing gogcli formula..."
                brew install openclaw/tap/gogcli
              fi

              if [ -x /home/linuxbrew/.linuxbrew/bin/gog ] && [ ! -e /home/linuxbrew/.linuxbrew/bin/gogcli ]; then
                log "Creating gogcli compatibility symlink"
                ln -sf /home/linuxbrew/.linuxbrew/bin/gog /home/linuxbrew/.linuxbrew/bin/gogcli
              fi

              # Original skill installation logic
              mkdir -p /home/node/.openclaw/workspace
              cd /home/node/.openclaw/workspace
              mkdir -p skills
              if [ -n "$CLAWHUB_TOKEN" ]; then
                log "Logging into ClawHub..."
                npx -y clawhub login --token "$CLAWHUB_TOKEN" --no-browser || true
              fi

              for skill in weather gog; do
                if [ -n "$skill" ] && [ ! -d "skills/${skill##*/}" ]; then
                  log "Installing skill: $skill"
                  npx -y clawhub install "$skill" --no-input || true
                else
                  log "Skill already installed: $skill"
                fi
              done
              chown -R 1000:1000 /home/node/.openclaw /home/node/.config /home/linuxbrew
              log "Skills initialization complete"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID

      containers:
        main:
          envFrom:
            - secretRef:
                name: openclaw-env-secret
          env:
            OPENCLAW_MODELS_ALLOW: "anthropic/claude-sonnet-4-5,anthropic/claude-haiku-4-5,openai/gpt-5-mini,xai/grok-4-1-fast-reasoning,xai/grok-4-1-fast"
            PATH: "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            XDG_CONFIG_HOME: "/home/node/.config"
            GOG_HOME: "/home/node/.config/gogcli"

  service:
    main:
      type: LoadBalancer

  persistence:
    data:
      storageClass: managed-nfs-storage
      advancedMounts:
        main:
          init-config:
            - path: /home/node/.openclaw
            - path: /home/node/.config
              subPath: xdg-config
          init-skills:
            - path: /home/node/.openclaw
            - path: /home/node/.config
              subPath: xdg-config
          main:
            - path: /home/node/.openclaw
            - path: /home/node/.config
              subPath: xdg-config
    linuxbrew:
      enabled: true
      type: persistentVolumeClaim
      storageClass: managed-nfs-storage
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          init-config:
            - path: /home/linuxbrew
          init-skills:
            - path: /home/linuxbrew
          main:
            - path: /home/linuxbrew

  networkpolicies:
    main:
      enabled: false
