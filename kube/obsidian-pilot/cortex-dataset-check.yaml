---
apiVersion: batch/v1
kind: Job
metadata:
  name: cortex-dataset-check
  namespace: obsidian-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-pilot
        app.kubernetes.io/component: api-qualification
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qualify
          image: ghcr.io/vrtmrz/livesync-cli@sha256:18bd63c1f7fe7a84121166a4c6f173871f8266b3bcec4bf5a2e4ada64f4b6de5
          command: [node, /checks/cortex-dataset-check.mjs]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: checks, mountPath: /checks, readOnly: true}
            - {name: cortex, mountPath: /cortex, readOnly: true}
            - {name: database, mountPath: /database, readOnly: true}
      volumes:
        - name: checks
          configMap: {name: cortex-dataset-check}
        - name: cortex
          secret: {secretName: cortex-auth, defaultMode: 0440}
        - name: database
          secret: {secretName: database-access, defaultMode: 0440}
