---
apiVersion: batch/v1
kind: Job
metadata:
  name: livesync-bootstrap-v2
  namespace: obsidian-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-pilot
        app.kubernetes.io/component: livesync-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      schedulingGates:
        - name: home-kube/manual-owner-release
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: bletchley002
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/vrtmrz/livesync-cli@sha256:18bd63c1f7fe7a84121166a4c6f173871f8266b3bcec4bf5a2e4ada64f4b6de5
          command: [node, /checks/livesync-bootstrap.mjs]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault
              mountPath: /vault
              subPath: vault
            - name: state
              mountPath: /data
              subPath: state
            - name: checks
              mountPath: /checks
              readOnly: true
            - name: pilot
              mountPath: /pilot
              readOnly: true
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vault
        - name: state
          persistentVolumeClaim:
            claimName: livesync-state
        - name: checks
          configMap:
            name: livesync-bootstrap
        - name: pilot
          secret:
            secretName: livesync-bootstrap
            defaultMode: 0440
