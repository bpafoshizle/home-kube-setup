---
# Native-binding diagnostic only: no app entrypoint, vault, PVC, token or endpoint.
apiVersion: batch/v1
kind: Job
metadata:
  name: native-cortex-check
  namespace: obsidian-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-pilot
        app.kubernetes.io/component: native-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: bletchley002
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: native-check
          image: ghcr.io/aliasunder/vault-cortex@sha256:2ad32d433956fa96764ca6afffee9470ec4f1cd51dcb734615f52b121be8b0e5
          command: [node, -e]
          args:
            - |
              if (process.arch !== 'arm64') throw new Error('Not native ARM64');
              const Database = require('better-sqlite3');
              const db = new Database(':memory:');
              if (db.prepare('SELECT 42 AS value').get().value !== 42) throw new Error('SQLite failed');
              const sqlite = db.prepare('SELECT sqlite_version() AS version').get().version;
              db.close();
              const ort = require('onnxruntime-node');
              console.log(JSON.stringify({architecture: process.arch, node: process.version,
                uid: process.getuid(), sqlite, onnx: ort.env.versions}));
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
