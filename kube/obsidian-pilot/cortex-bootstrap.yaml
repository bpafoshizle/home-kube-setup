---
apiVersion: batch/v1
kind: Job
metadata:
  name: cortex-bootstrap
  namespace: obsidian-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-pilot
        app.kubernetes.io/component: cortex-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      schedulingGates:
        - name: home-kube/manual-owner-release
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: bletchley002
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/aliasunder/vault-cortex@sha256:2ad32d433956fa96764ca6afffee9470ec4f1cd51dcb734615f52b121be8b0e5
          command: [node, /checks/cortex-bootstrap.mjs]
          env:
            - {name: VAULT_PATH, value: /vault}
            - {name: INDEX_DB_PATH, value: /data/index.db}
            - {name: PUBLIC_URL, value: 'https://obsidian-pilot.tail55ae3f.ts.net'}
            - {name: MEMORY_ENABLED, value: 'false'}
            - {name: EMBEDDING_ENABLED, value: 'false'}
            - {name: RERANK_MODE, value: none}
            - {name: READONLY_MODE, value: 'true'}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: cortex-auth, key: token}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: vault, mountPath: /vault, subPath: vault, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: checks, mountPath: /checks, readOnly: true}
      volumes:
        - name: vault
          persistentVolumeClaim: {claimName: vault}
        - name: state
          persistentVolumeClaim: {claimName: cortex-state}
        - name: checks
          configMap: {name: cortex-bootstrap}
