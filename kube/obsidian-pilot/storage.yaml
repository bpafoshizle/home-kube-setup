---
# Standard kubelet CHAP handling accepted; explicit single-owner release remains:
# https://github.com/bpafoshizle/home-kube-setup/issues/84#issuecomment-6502567555
apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-pilot
  labels:
    app.kubernetes.io/part-of: obsidian-pilot
---
# No StorageClass: never allocate a default NFS volume for Cortex SQLite WAL.
# Mapping verified against the authenticated session and matching SCSI serial.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: obsidian-pilot-cortex
  labels:
    app.kubernetes.io/part-of: obsidian-pilot
  annotations:
    home-kube/lun-uuid: 9a583351-01a2-45f5-abed-b38a476594dd
    home-kube/filesystem-uuid: 256f8624-4e9c-45eb-95de-9103c3c955fe
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: obsidian-pilot
    name: cortex-state
  mountOptions: [nosuid, nodev, noexec]
  iscsi:
    targetPortal: 192.168.0.43:3260
    iqn: iqn.2000-01.com.synology:lynott.obsidian-pilot-cortex
    lun: 1
    fsType: ext4
    readOnly: false
    chapAuthDiscovery: false
    chapAuthSession: true
    secretRef:
      namespace: obsidian-pilot
      name: cortex-iscsi-chap
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-state
  namespace: obsidian-pilot
  labels:
    app.kubernetes.io/part-of: obsidian-pilot
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: obsidian-pilot-cortex
  resources:
    requests:
      storage: 5Gi
