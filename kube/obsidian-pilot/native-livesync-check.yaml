---
# Load the packaged native binding only; never opens a DB or starts replication.
apiVersion: batch/v1
kind: Job
metadata:
  name: native-livesync-check
  namespace: obsidian-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-pilot
        app.kubernetes.io/component: native-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: bletchley002
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: native-check
          image: ghcr.io/vrtmrz/livesync-cli@sha256:18bd63c1f7fe7a84121166a4c6f173871f8266b3bcec4bf5a2e4ada64f4b6de5
          command: [node, -e]
          args:
            - |
              if (process.arch !== 'arm64') throw new Error('Not native ARM64');
              const leveldown = require('leveldown');
              const db = leveldown('/never-opened');
              if (db.status !== 'new') throw new Error('Unexpected database state');
              console.log(JSON.stringify({architecture: process.arch, node: process.version,
                uid: process.getuid(), leveldown: require('leveldown/package.json').version,
                databaseOpened: false}));
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
