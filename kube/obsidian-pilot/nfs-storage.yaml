---
# Same existing NAS provisioner; separate Retain policy, no controller install.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: obsidian-pilot-nfs-retain
  labels:
    app.kubernetes.io/part-of: obsidian-pilot
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: 'true'
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault
  namespace: obsidian-pilot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: obsidian-pilot-nfs-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: livesync-state
  namespace: obsidian-pilot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: obsidian-pilot-nfs-retain
  resources:
    requests:
      storage: 1Gi
