{{- if .Values.enabled }}
{{- $vault := required "vaultId is required" .Values.vaultId }}
{{- $node := required "ownerNode is a temporary explicit owner, never automatic failover" .Values.ownerNode }}
{{- $release := required "ownerReleaseConfigMap is required" .Values.ownerReleaseConfigMap }}
{{- $origin := required "publicOrigin is required" .Values.publicOrigin }}
{{- if not (regexMatch "^https://[a-z0-9.-]+\\.ts\\.net$" $origin) }}
{{- fail "publicOrigin must be the verified bare private tailnet HTTPS origin" }}
{{- end }}
{{- range $image := list .Values.livesync.image .Values.cortex.image }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $image) }}
{{- fail "only immutable image digests are allowed" }}
{{- end }}
{{- end }}
{{- if not .Values.livesync.requiredState }}
{{- fail "livesync.requiredState must contain the actual bootstrapped durable state paths" }}
{{- end }}
{{- $vaultMount := dict "path" "/vault" "types" (list "nfs" "nfs4") "source" (required "vault source required" .Values.mountSources.vault) "marker" ".pilot-vault.json" "identity" (dict "vault" $vault "purpose" "working-vault") }}
{{- $syncMount := dict "path" "/data" "types" (list "nfs" "nfs4") "source" (required "livesync source required" .Values.mountSources.livesync) "marker" ".pilot-sync-state.json" "identity" (dict "vault" $vault "purpose" "livesync-state") "required" .Values.livesync.requiredState }}
{{- $cortexMount := dict "path" "/data" "types" (list "ext4") "source" (required "observed Cortex source required" .Values.mountSources.cortex) "marker" ".pilot-storage.json" "identity" (dict "vault" $vault "lun_uuid" (required "LUN UUID required" .Values.cortex.lunUUID) "filesystem_uuid" (required "filesystem UUID required" .Values.cortex.filesystemUUID)) "required" .Values.cortex.requiredState }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-guard
data:
  guard.mjs: |
{{ .Files.Get "files/guard.mjs" | indent 4 }}
  livesync.json: |
    {{ dict "vault" $vault "releaseFile" "/owner/release.json" "mounts" (list $vaultMount $syncMount) "observedFiles" (dict "stateFile" "/data/.guard-observed-files.json" "paths" (list "/vault/.livesync-snapshot.json")) | toJson }}
  cortex.json: |
    {{ dict "vault" $vault "releaseFile" "/owner/release.json" "mounts" (list $vaultMount $cortexMount) | toJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ ternary 0 1 .Values.maintenanceHold }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        home-kube/guard-checksum: {{ .Files.Get "files/guard.mjs" | sha256sum }}
        home-kube/config-checksum: {{ dict "vault" $vault "origin" $origin "sources" .Values.mountSources "livesync" .Values.livesync "cortex" .Values.cortex | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      schedulingGates:
        - name: home-kube/manual-owner-release
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: {{ $node | quote }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livesync
          image: {{ .Values.livesync.image | quote }}
          command: [node, /guard/guard.mjs, /guard/livesync.json, livesync-cli, --vault, /vault, daemon]
          env:
            - name: LIVESYNC_DB_PATH
              value: /data
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: vault, mountPath: /vault, subPath: {{ .Values.subPaths.vault | quote }}}
            - {name: sync, mountPath: /data, subPath: {{ .Values.subPaths.livesync | quote }}}
            - {name: guard, mountPath: /guard, readOnly: true}
            - {name: owner, mountPath: /owner, readOnly: true}
        - name: cortex
          image: {{ .Values.cortex.image | quote }}
          command: [/usr/bin/tini, --, node, /guard/guard.mjs, /guard/cortex.json, node, --enable-source-maps, dist/src/vault-mcp/server.js]
          env:
            - {name: VAULT_PATH, value: /vault}
            - {name: INDEX_DB_PATH, value: /data/index.db}
            - {name: PUBLIC_URL, value: {{ $origin | quote }}}
            - {name: MEMORY_ENABLED, value: 'false'}
            - {name: EMBEDDING_ENABLED, value: 'false'}
            - {name: RERANK_MODE, value: none}
            - {name: READONLY_MODE, value: {{ .Values.cortex.readOnly | quote }}}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "cortex.authSecret required" .Values.cortex.authSecret }}
                  key: token
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: vault, mountPath: /vault, subPath: {{ .Values.subPaths.vault | quote }}, readOnly: {{ .Values.cortex.readOnly }}}
            - {name: cortex, mountPath: /data}
            - {name: guard, mountPath: /guard, readOnly: true}
            - {name: owner, mountPath: /owner, readOnly: true}
      volumes:
        - name: vault
          persistentVolumeClaim: {claimName: {{ required "vault claim required" .Values.claims.vault }}}
        - name: sync
          persistentVolumeClaim: {claimName: {{ required "livesync claim required" .Values.claims.livesync }}}
        - name: cortex
          persistentVolumeClaim: {claimName: {{ required "cortex claim required" .Values.claims.cortex }}}
        - name: guard
          configMap: {name: {{ .Release.Name }}-guard}
        - name: owner
          configMap: {name: {{ $release }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8000, targetPort: http}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    tailscale.com/hostname: {{ required "ingress.hostname required" .Values.ingress.hostname | quote }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [{{ trimPrefix "https://" $origin | quote }}]
  rules:
    - host: {{ trimPrefix "https://" $origin | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {number: 8000}
{{- end }}
{{- end }}
