---
# Host configuration only; does not discover/login, format, mount or allocate storage.
# Refuse identity replacement while sessions may exist. No automatic node recovery.
- name: Establish stable worker iSCSI identities for the disposable vault pilot
  hosts: kubecompute
  remote_user: ubuntu
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    pilot_initiator_iqn: "iqn.2026-10.local.home-kube:{{ inventory_hostname }}"
  tasks:
    - name: Read current initiator configuration
      ansible.builtin.slurp:
        src: /etc/iscsi/initiatorname.iscsi
      register: initiator_config

    - name: Refuse overwriting an unexpected existing identity
      ansible.builtin.assert:
        that:
          - >-
            (initiator_config.content | b64decode | trim == 'GenerateName=yes') or
            (initiator_config.content | b64decode | trim == 'InitiatorName=' + pilot_initiator_iqn)
        fail_msg: Unexpected initiator configuration; investigate rather than replace it.

    - name: Inspect existing sessions without discovery or login
      ansible.builtin.command: iscsiadm -m session
      register: iscsi_sessions
      changed_when: false
      failed_when: iscsi_sessions.rc not in [0, 21]
      check_mode: false

    - name: Require no active sessions before configuring an identity
      ansible.builtin.assert:
        that:
          - iscsi_sessions.rc == 21
        fail_msg: Active iSCSI sessions exist; this pilot must not disrupt them.

    - name: Require an inactive daemon before configuring an identity
      ansible.builtin.command: systemctl is-active iscsid.service
      register: iscsi_daemon
      changed_when: false
      failed_when: iscsi_daemon.rc not in [0, 3]
      check_mode: false

    - name: Refuse a potentially cached active daemon identity
      ansible.builtin.assert:
        that:
          - iscsi_daemon.stdout == 'inactive'
        fail_msg: iscsid is active; inspect its identity and users before making changes.

    - name: Record the explicit unique worker identity
      ansible.builtin.copy:
        dest: /etc/iscsi/initiatorname.iscsi
        content: "InitiatorName={{ pilot_initiator_iqn }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Verify the identity readback
      ansible.builtin.slurp:
        src: /etc/iscsi/initiatorname.iscsi
      register: initiator_readback
      when: not ansible_check_mode

    - name: Assert the recorded identity
      ansible.builtin.assert:
        that:
          - initiator_readback.content | b64decode | trim == 'InitiatorName=' + pilot_initiator_iqn
      when: not ansible_check_mode
