---
# One-shot disposable initialization. No fallback/reformat path on existing state.
- name: Check all workers immediately before initializing the sole-owner LUN
  hosts: kubecompute
  remote_user: ubuntu
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require explicit initialization authorization and all workers
      ansible.builtin.assert:
        that:
          - pilot_initialize_blank_lun | default(false) | bool
          - ansible_play_hosts_all | sort == groups['kubecompute'] | sort

    - name: Check session ownership
      ansible.builtin.command: iscsiadm -m session
      register: sessions
      changed_when: false
      check_mode: false
      failed_when: >-
        (inventory_hostname != 'bletchley002' and sessions.rc != 21) or
        (inventory_hostname == 'bletchley002' and
        (sessions.rc != 0 or sessions.stdout_lines | length != 1 or
        '192.168.0.43:3260,1 iqn.2000-01.com.synology:lynott.obsidian-pilot-cortex' not in sessions.stdout))

- name: Initialize only the exact verified disposable LUN
  hosts: bletchley002
  remote_user: ubuntu
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Fully verify blank device before changing anything
      ansible.builtin.script:
        cmd: files/initialize-obsidian-pilot-cortex.py
        executable: python3
      changed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: Format, mount, sync identity sentinel, unmount and check filesystem
      ansible.builtin.script:
        cmd: files/initialize-obsidian-pilot-cortex.py --initialize-blank-lun
        executable: python3
      when: not ansible_check_mode
